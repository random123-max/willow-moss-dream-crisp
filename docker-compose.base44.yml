services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .${BASE44_SANDBOX_HOST_DOMAIN}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:8080"
    command: sh -c 'npm ci --no-audit --no-fund && npm run dev'

volumes:
  node_modules:
